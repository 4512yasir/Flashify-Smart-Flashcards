<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashify - Smart Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>Flashify - Smart Flashcards</h1>
        </header>

        <!-- Flashcard Creation Form -->
        <section class="form-section">
            <form id="flashcard-form">
                <label for="question">Question:</label>
                <input type="text" id="question" placeholder="Enter question" required>
                
                <label for="answer">Answer:</label>
                <input type="text" id="answer" placeholder="Enter answer" required>
                
                <button type="submit">Add Flashcard</button>
            </form>
        </section>

        <!-- Flashcards Display Section -->
        <section id="flashcard-list">
            <h2>Your Flashcards</h2>
            <!-- Flashcards will be displayed here -->
        </section>

        <!-- Button to Clear All Flashcards -->
        <button id="clear-btn">Clear All Flashcards</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
